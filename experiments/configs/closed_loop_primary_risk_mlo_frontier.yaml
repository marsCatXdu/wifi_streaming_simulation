extends: closed_loop_primary_risk_mlo_005.yaml
name: closed-loop-primary-risk-mlo-frontier-v1
output_root: results/primary_risk_mlo_frontier_v1/runs
workers: 36

# Seeds 43-54 remain engineering data. The 0.034 fixed gate was selected from
# the two earlier operating points and a retrospective nested-action sweep; it
# is therefore not confirmation evidence. Rerun every treatment here so STR,
# EMLSR, and adaptive results share one build identity and the corrected EMLSR
# state-boundary behavior.
topologies:
  - name: dual_interface
  - name: mlo_str
  - name: mlo_emlsr

policies:
  - name: adaptive_airtime_duplication
    topologies: [dual_interface]
    config:
      prediction.prediction_telemetry_enabled: true
      prediction.prediction_sample_offsets_us: [0]
      prediction.prediction_history_windows_us: [1000, 5000, 20000]
      prediction.prediction_polling_interval_us: 1000
      prediction.prediction_polling_report_delay_us: 1000
      prediction.prediction_event_log_enabled: false
      prediction.prediction_oracle_features_enabled: false
      prediction.secondary_airtime_meter_enabled: true
      prediction.adaptive_airtime_admission_uses_retry_inflation: false
      prediction.adaptive_airtime_budget_fraction: 0.02
      prediction.adaptive_airtime_bucket_horizon_us: 10000000
      prediction.adaptive_airtime_initial_bucket_horizon_us: 2000000
      prediction.adaptive_airtime_initial_shadow_price: 0.034
      prediction.adaptive_airtime_dual_step: 0.0
      prediction.adaptive_airtime_cost_safety_factor: 1.25
      prediction.adaptive_airtime_cost_ewma_alpha: 0.10
      prediction.adaptive_airtime_decision_offsets_us: [0]
  - name: fixed_link_0
    topologies: [mlo_str, mlo_emlsr]
