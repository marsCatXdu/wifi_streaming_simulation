# Frozen analysis contract for latency-risk prediction.
analysis_schema_version: 1
specification_revision: 8
accepted_increment_1_commit: c82c781cb0847ae337ed87eaf41c6a4053393b0b

# Reproducibility and grouped partitioning.
analysis_seed: 20260725
split_seed: 20260725
bootstrap_seed: 20260726
minimum_run_groups_validation_selection: 10
minimum_run_groups_validation_calibration: 10
minimum_run_groups_id_test: 20
minimum_run_groups_per_required_ood_scenario: 20
minimum_training_misses: 2000
minimum_misses_per_major_test_subset: 500

# Evaluation unit and fixed reporting choices.
stages: [T0, T1, T2, T4]
links: [0, 1]
combine_links_for_formal_decision: false
ranking_budgets: [0.05, 0.10, 0.20]
screening_budget: 0.10
pr_auc_metric: average_precision
calibration_bin_count: 10
calibration_method: platt
confidence_level: 0.95
bootstrap_replicates: 2000
minimum_rescue_time_us: 5000
model_name_order:
  - logistic_regression
  - histogram_gradient_boosting

# Required OOD evidence is evaluated separately by scenario.
required_ood_scenarios:
  - obss_only
  - obss_plus_legacy_mixed8
ood_scenarios:
  - scenario_id: obss_only
    status: required
    run_filter:
      scenario_id: obss_only
      topology: dual_interface
      obss_profile: mixed4x4
      background_profile: none
      propagation_model: log_distance_nakagami
  - scenario_id: obss_plus_legacy_mixed8
    status: required
    run_filter:
      scenario_id: obss_plus_legacy_mixed8
      topology: dual_interface
      obss_profile: mixed4x4
      background_profile: legacy_mixed8
      propagation_model: log_distance_nakagami
ood_formal_aggregation: per_scenario_worst_case
pooled_ood_decision_use: false

# Stable go/no-go thresholds.
minimum_f2_recall: 0.40
minimum_random_multiple: 3.0
minimum_heuristic_gain: 0.10
minimum_f2_incremental_gain: 0.10
minimum_ood_retention: 0.70
minimum_later_stage_gain: 0.10
maximum_fixed_threshold_action_rate_overshoot: 0.02

# F2 fields with an explicit modified-driver export mechanism.
f2_exportable_allowlist:
  - frame_packets_mac_enqueued
  - frame_packets_mac_dequeued
  - frame_packets_tx_succeeded
  - frame_mpdu_attempt_failures
  - frame_packets_terminally_dropped
  - frame_packets_currently_queued
  - frame_mac_service_bytes_currently_queued
  - mac_queue_packets
  - mac_queue_service_bytes
  - mac_queue_oldest_enqueue_time_ns
  - packets_ahead_of_frame
  - mac_service_bytes_ahead_of_frame
  - frame_packets_pending_primary
  - frame_mac_service_bytes_not_acknowledged
  - frame_mac_service_bytes_pending_primary

# Deterministic commodity-observation sensitivity profiles.
f1_degradation_profiles:
  - profile_id: polling_1ms
    report_interval_us: 1000
    observation_delay_us: 1000
    counter_quantization: 1
    signal_quantization_db: 1
    rate_quantization: 1
    disabled_feature_families: []
  - profile_id: polling_5ms
    report_interval_us: 5000
    observation_delay_us: 2000
    counter_quantization: 4
    signal_quantization_db: 2
    rate_quantization: 1
    disabled_feature_families: []
