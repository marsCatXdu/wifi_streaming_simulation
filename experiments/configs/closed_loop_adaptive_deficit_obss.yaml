extends: closed_loop_adaptive_airtime_obss.yaml
name: closed-loop-adaptive-primary-deficit-obss-v1
output_root: results/adaptive_deficit_obss_v1/runs
workers: 64

policies:
  - name: fixed_link_1
    topologies: [dual_interface]
  - name: adaptive_airtime_duplication
    topologies: [dual_interface]
    config:
      prediction.prediction_telemetry_enabled: true
      prediction.prediction_sample_offsets_us: [0, 1000, 2000, 4000]
      prediction.prediction_history_windows_us: [1000, 5000, 20000]
      prediction.prediction_polling_interval_us: 1000
      prediction.prediction_polling_report_delay_us: 1000
      prediction.prediction_event_log_enabled: false
      prediction.prediction_oracle_features_enabled: false
      prediction.secondary_airtime_meter_enabled: true
      prediction.adaptive_airtime_budget_fraction: 0.02
      prediction.adaptive_airtime_bucket_horizon_us: 1000000
      prediction.adaptive_airtime_initial_shadow_price: 0.20
      prediction.adaptive_airtime_dual_step: 0.01
      prediction.adaptive_airtime_cost_safety_factor: 1.25
      prediction.adaptive_airtime_cost_ewma_alpha: 0.10
      prediction.adaptive_airtime_decision_offsets_us: [0, 1000, 2000, 4000]
  - name: adaptive_deficit_duplication
    topologies: [dual_interface]
    config:
      prediction.prediction_telemetry_enabled: true
      prediction.prediction_sample_offsets_us: [0, 1000, 2000, 4000]
      prediction.prediction_history_windows_us: [1000, 5000, 20000]
      prediction.prediction_polling_interval_us: 1000
      prediction.prediction_polling_report_delay_us: 1000
      prediction.prediction_event_log_enabled: false
      prediction.prediction_oracle_features_enabled: false
      prediction.secondary_airtime_meter_enabled: true
      prediction.adaptive_airtime_budget_fraction: 0.02
      prediction.adaptive_airtime_bucket_horizon_us: 1000000
      prediction.adaptive_airtime_initial_shadow_price: 0.20
      prediction.adaptive_airtime_dual_step: 0.01
      prediction.adaptive_airtime_cost_safety_factor: 1.25
      prediction.adaptive_airtime_cost_ewma_alpha: 0.10
      prediction.adaptive_airtime_decision_offsets_us: [0, 1000, 2000, 4000]
  - name: full_duplication
    topologies: [dual_interface]
    config:
      wifi.full_duplication_primary_path: 1
      prediction.secondary_airtime_meter_enabled: true
  - name: fixed_link_0
    topologies: [mlo_str]
