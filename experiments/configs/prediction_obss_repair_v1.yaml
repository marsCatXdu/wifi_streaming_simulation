extends: prediction_obss.yaml
name: prediction-obss-repair-v1
output_root: results/prediction_obss_repair_v1
workers: 10

policies:
  # Rerun both links for the one incomplete OBSS-only matched group.
  - name: fixed_link_0
    seeds: [417]
  - name: fixed_link_1
    seeds: [417]

  # Rerun both links for every incomplete OBSS-plus-legacy matched group.
  - name: fixed_link_0
    seeds: &obss_plus_legacy_repair_seeds
      [402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412,
       413, 414, 416, 417, 418, 419, 420, 421, 422, 423, 424]
    config: &obss_plus_legacy
      background.background_profile: legacy_mixed8
      background.background_traffic: udp_random_onoff
  - name: fixed_link_1
    seeds: *obss_plus_legacy_repair_seeds
    config:
      <<: *obss_plus_legacy
