name: prediction-stage-a
output_root: results/prediction_stage_a
workers: 10

base:
  stream:
    source: synthetic
    duration: 60
    fps: 30
    frame_size: 12000
    gop_length: 60
    keyframe_size_multiplier: 4
    payload_size: 1200
    deadline_us: 33333
    emission_mode: burst
  propagation:
    propagation_model: log_distance_nakagami
    station_distance_m: 10
    path_loss_exponent: 3
    reference_loss_2_4_ghz_db: 40.046
    reference_loss_5_ghz_db: 46.678
    nakagami_distance_1_m: 80
    nakagami_distance_2_m: 200
    nakagami_m0: 1.5
    nakagami_m1: 0.75
    nakagami_m2: 0.75
    propagation_stream_base: 5000
  wifi:
    wifi_standard: eht
    queue_max_packets: 500
    max_amsdu_size: 0
    fragmentation_threshold: 65535
    ul_ofdma_enabled: false
  background:
    background_profile: legacy_mixed8
    background_traffic: udp_bursty
    background_direction: uplink
    background_packet_size: 1200
    background_stream_base: 4000
    common_on_mean_ms: 100
    common_off_mean_ms: 100
    local_on_mean_ms: 100
    local_off_mean_ms: 100
  prediction:
    prediction_telemetry_enabled: true
    prediction_sample_offsets_us: [0, 1000, 2000, 4000]
    prediction_history_windows_us: [1000, 5000, 20000]
    prediction_polling_interval_us: 1000
    prediction_polling_report_delay_us: 1000
    prediction_event_log_enabled: false
    prediction_oracle_features_enabled: true

seeds: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210]
runs: [1]

topologies:
  - name: dual_interface

policies:
  # Unloaded reference.
  - name: fixed_link_0
    config:
      background.background_profile: none
      background.background_traffic: none
  - name: fixed_link_1
    config:
      background.background_profile: none
      background.background_traffic: none

  # Independent per-link bursts.
  - name: fixed_link_0
    config: &independent_2_5_link0
      background.correlation_mode: independent
      background.background_rate_mbps: 2.5
  - name: fixed_link_1
    config:
      <<: *independent_2_5_link0
  - name: fixed_link_0
    config: &independent_3_5_link0
      background.correlation_mode: independent
      background.background_rate_mbps: 3.5
  - name: fixed_link_1
    config:
      <<: *independent_3_5_link0
  - name: fixed_link_0
    config: &independent_5_link0
      background.correlation_mode: independent
      background.background_rate_mbps: 5
  - name: fixed_link_1
    config:
      <<: *independent_5_link0
  - name: fixed_link_0
    config: &independent_5_5_link0
      background.correlation_mode: independent
      background.background_rate_mbps: 5.5
  - name: fixed_link_1
    config:
      <<: *independent_5_5_link0
  - name: fixed_link_0
    config: &independent_7_link0
      background.correlation_mode: independent
      background.background_rate_mbps: 7
  - name: fixed_link_1
    config:
      <<: *independent_7_link0

  # Common cross-link bursts.
  - name: fixed_link_0
    config: &common_2_5_link0
      background.correlation_mode: common_bursts
      background.background_rate_mbps: 2.5
  - name: fixed_link_1
    config:
      <<: *common_2_5_link0
  - name: fixed_link_0
    config: &common_3_5_link0
      background.correlation_mode: common_bursts
      background.background_rate_mbps: 3.5
  - name: fixed_link_1
    config:
      <<: *common_3_5_link0
  - name: fixed_link_0
    config: &common_5_link0
      background.correlation_mode: common_bursts
      background.background_rate_mbps: 5
  - name: fixed_link_1
    config:
      <<: *common_5_link0
  - name: fixed_link_0
    config: &common_5_5_link0
      background.correlation_mode: common_bursts
      background.background_rate_mbps: 5.5
  - name: fixed_link_1
    config:
      <<: *common_5_5_link0
  - name: fixed_link_0
    config: &common_7_link0
      background.correlation_mode: common_bursts
      background.background_rate_mbps: 7
  - name: fixed_link_1
    config:
      <<: *common_7_link0

  # Mixed common and independent bursts.
  - name: fixed_link_0
    config: &mixed_2_25_link0
      background.correlation_mode: mixed_common_and_independent
      background.background_rate_mbps: 2.25
  - name: fixed_link_1
    config:
      <<: *mixed_2_25_link0
  - name: fixed_link_0
    config: &mixed_3_link0
      background.correlation_mode: mixed_common_and_independent
      background.background_rate_mbps: 3
  - name: fixed_link_1
    config:
      <<: *mixed_3_link0
  - name: fixed_link_0
    config: &mixed_3_25_link0
      background.correlation_mode: mixed_common_and_independent
      background.background_rate_mbps: 3.25
  - name: fixed_link_1
    config:
      <<: *mixed_3_25_link0
  - name: fixed_link_0
    config: &mixed_4_link0
      background.correlation_mode: mixed_common_and_independent
      background.background_rate_mbps: 4
  - name: fixed_link_1
    config:
      <<: *mixed_4_link0
  - name: fixed_link_0
    config: &mixed_5_5_link0
      background.correlation_mode: mixed_common_and_independent
      background.background_rate_mbps: 5.5
  - name: fixed_link_1
    config:
      <<: *mixed_5_5_link0
