extends: closed_loop_adaptive_airtime_obss.yaml
name: randomized-full-copy-exploration-pilot-v1
output_root: results/randomized_full_copy_exploration_pilot_v1/runs
workers: 64

# Engineering/causal-collection pilot only. Seeds 1001-1012 are intentionally
# outside earlier development campaigns. They are not confirmation evidence;
# seeds 1301 and above remain untouched for a later locked confirmation.
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012]
runs: [1]

# Inherit the unmodified mixed4x4 OBSS environment. Collect only the
# dual-interface randomized treatment needed to estimate frame-level causal
# effects; MLO comparison arms belong in the later confirmation campaign.
topologies:
  - name: dual_interface

policies:
  - name: randomized_full_copy_exploration
    topologies: [dual_interface]
    config:
      prediction.prediction_telemetry_enabled: true
      prediction.prediction_sample_offsets_us: [0, 2000, 4000]
      prediction.prediction_history_windows_us: [1000, 5000, 20000]
      prediction.prediction_polling_interval_us: 1000
      prediction.prediction_polling_report_delay_us: 1000
      prediction.prediction_event_log_enabled: false
      prediction.prediction_oracle_features_enabled: false
      prediction.secondary_airtime_meter_enabled: true
      # SplitMix64-v1 assigns 80% control, 8% T2, and 12% T4. The controller
      # fixes T2/T4 at 2000/4000 us and derives the common assignment interval
      # from the measurement window, withholding its final 534 ms.
      prediction.randomized_assignment_salt: 5927104639973545521
      prediction.randomized_t2_probability: 0.08
      prediction.randomized_t4_probability: 0.12
      prediction.randomized_assignment_stop_guard_us: 534000
